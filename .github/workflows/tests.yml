name: Mac Brain tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Enforce Python-only repository policy
        run: python3 tools/repo_policy.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile every Python program
        run: python3 -m compileall -q install.py macbrain scripts tools tests
