name: Mac Brain tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m py_compile install.py macbrain/*.py
      - name: Check shell syntax
        run: bash -n scripts/network_lock.sh scripts/network_unlock.sh scripts/uninstall.sh
      - name: Check Python 3.8 compatibility (Big Sur /usr/bin/python3)
        run: |
          python3 - <<'PY'
          import ast, glob
          for f in ["install.py"] + glob.glob("macbrain/*.py") + glob.glob("tests/*.py"):
              ast.parse(open(f).read(), f, feature_version=(3, 8))
          PY
