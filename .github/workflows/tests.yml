name: Mac Brain tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Enforce Python-only repository policy
        shell: python
        run: |
          import runpy
          runpy.run_path("tools/repo_policy.py", run_name="__main__")
      - name: Run unit tests
        shell: python
        run: |
          import os
          import sys
          import unittest
          sys.path.insert(0, os.getcwd())
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
      - name: Compile every Python program
        shell: python
        run: |
          import compileall
          ok = True
          for target in ("install.py", "macbrain", "scripts", "tools", "tests"):
              if target.endswith(".py"):
                  ok = compileall.compile_file(target, quiet=1) and ok
              else:
                  ok = compileall.compile_dir(target, quiet=1) and ok
          raise SystemExit(0 if ok else 1)
